<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- CSP：仅同源资源，禁止 eval 类指令与内联脚本，静态资源由 Rust 内嵌托管 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>5G-MIFI 管理中心</title>
<link rel="icon" type="image/svg+xml" href="/icons/brand-live.svg">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<!-- 白色毛玻璃 + 动态 SVG 背景 -->
<link rel="stylesheet" href="/css/glass.css">
<!-- 三种弹窗形态（Centered / Bottom Sheet / Right Side Sheet） -->
<link rel="stylesheet" href="/css/sheets.css">
<!-- 全分辨率响应式（安全区 / 100dvh / 断点），必须最后加载 -->
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<div class="app-shell" id="shell">
  <!-- 侧边栏容器：导航项由 app.js 挂载 -->
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="brand__logo"><img class="brand__live" src="/icons/brand-live.svg" alt="5G-MIFI 动态标识"></span>
      <div class="brand__text">
        <h1 id="brand-title">5G-MIFI</h1>
        <p id="brand-subtitle">管理中心</p>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="页面导航"></nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>

  <!-- 主内容区 -->
  <div class="main">
    <header class="topbar" id="topbar">
      <div class="topbar__inner">
        <div class="topbar__left">
          <button type="button" class="icon-btn topbar__menu" id="menu-btn" aria-label="展开菜单">
            <svg class="icon"><use href="/icons/sprite.svg#icon-menu"/></svg>
          </button>
          <div>
            <h2 class="topbar__title" id="topbar-title">系统监控</h2>
            <p class="topbar__subtitle" id="topbar-subtitle">实时监控设备状态</p>
          </div>
        </div>
        <div class="topbar__actions" id="topbar-actions"></div>
      </div>
    </header>
    <div class="page">
      <main id="app" role="main"></main>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
</div>

<!-- 看门狗状态条：界面假死 / 后端失联时由 core/watchdog.js 控制显示 -->
<div class="watchdog-banner" id="watchdog-banner" data-level="warning" aria-live="polite">
  <span class="watchdog-banner__dot" aria-hidden="true"></span>
  <span class="watchdog-banner__text" id="watchdog-banner-text"></span>
  <button type="button" id="watchdog-banner-action" hidden></button>
</div>

<noscript>本管理界面需要启用 JavaScript（原生 ES Modules）才能运行。</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
