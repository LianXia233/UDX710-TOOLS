<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="280" height="170" role="img" aria-label="5G-MIFI 智能终端管理中心">
  <defs>
    <!-- 主渐变 -->
    <linearGradient id="lhPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- 设备机身玻璃渐变 -->
    <linearGradient id="lhBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 边框微光渐变 -->
    <linearGradient id="lhBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.7"/>
    </linearGradient>

    <!-- OLED 屏幕背景 -->
    <linearGradient id="lhOled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="lhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 径向光晕 -->
    <radialGradient id="lhHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 中心发光背景光晕 (平缓呼吸) -->
  <circle cx="140" cy="85" r="70" fill="url(#lhHalo)">
    <animate attributeName="r" values="64;78;64" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 动态外部旋转科技雷达环 -->
  <circle cx="140" cy="85" r="68" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="6 14" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 140 85" to="360 140 85" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- 动态内层逆向旋转环 -->
  <circle cx="140" cy="85" r="54" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="4 16">
    <animateTransform attributeName="transform" type="rotate" from="360 140 85" to="0 140 85" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- 5G 射频扩散天线发射波束 (三层由内而外依次点亮) -->
  <g fill="none" stroke="#0ea5e9" stroke-linecap="round" filter="url(#lhGlow)">
    <path d="M 118 42 A 28 28 0 0 1 162 42" stroke-width="3.2">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 32 A 42 42 0 0 1 174 32" stroke-width="2.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 94 22 A 58 58 0 0 1 186 22" stroke-width="2.2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 轨道数据光斑 1 -->
  <circle r="3.5" fill="#ffffff" filter="url(#lhGlow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 140 17 A 68 68 0 1 1 139.9 17 Z"/>
  </circle>

  <!-- 核心硬件终端基座 (5G-MIFI 随身路由设备造型) -->
  <rect x="92" y="58" width="96" height="66" rx="16" fill="url(#lhBody)" filter="url(#lhGlow)"/>
  <rect x="92" y="58" width="96" height="66" rx="16" fill="none" stroke="url(#lhBorder)" stroke-width="1.8"/>

  <!-- 设备正面嵌入式高亮 OLED 屏幕 -->
  <rect x="102" y="66" width="76" height="38" rx="8" fill="url(#lhOled)"/>
  <rect x="102" y="66" width="76" height="38" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- OLED 屏幕内部真实状态信息 -->
  <!-- 5G 信号阶梯 (5 格信号柱) -->
  <g fill="#38bdf8" transform="translate(108, 72)">
    <rect x="0" y="8" width="2" height="4" rx="1"/>
    <rect x="4" y="6" width="2" height="6" rx="1"/>
    <rect x="8" y="4" width="2" height="8" rx="1"/>
    <rect x="12" y="2" width="2" height="10" rx="1"/>
    <rect x="16" y="0" width="2" height="12" rx="1"/>
  </g>

  <!-- 屏幕电量图标 (右上角) -->
  <g stroke="#10b981" fill="none" stroke-width="1" transform="translate(156, 73)">
    <rect x="0" y="0" width="14" height="8" rx="1.5"/>
    <rect x="1.5" y="1.5" width="9" height="5" fill="#10b981" rx="0.5"/>
    <path d="M 14 2.5 V 5.5" stroke-linecap="round"/>
  </g>

  <!-- 屏幕中心网络制式 -->
  <text x="140" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="1">5G NR · SA</text>

  <!-- 设备下部物理指示灯状态条 (呼吸蓝光) -->
  <rect x="120" y="112" width="40" height="3" rx="1.5" fill="#38bdf8" filter="url(#lhGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 底部安全管理徽章 / 挂锁 (Security Badge) -->
  <g transform="translate(140, 134)">
    <circle cx="0" cy="0" r="10" fill="url(#lhPrimary)" filter="url(#lhGlow)"/>
    <!-- 锁梁 -->
    <path d="M -3 -1 A 3 3 0 0 1 3 -1 V 1 H -3 Z" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <!-- 锁身 -->
    <rect x="-4" y="0" width="8" height="6" rx="1.5" fill="#ffffff"/>
    <circle cx="0" cy="3" r="1" fill="#2563eb"/>
  </g>

  <!-- 底部反射倒影光弧 -->
  <ellipse cx="140" cy="158" rx="52" ry="5" fill="#38bdf8" fill-opacity="0.22">
    <animate attributeName="rx" values="46;56;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.16;0.28;0.16" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
