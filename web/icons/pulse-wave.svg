<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="动态信号波形">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".25"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3b5" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="wavePath"
      d="M0 96 C 40 96, 55 44, 90 44 S 145 128, 185 108 S 235 30, 275 62 S 330 130, 370 96 S 425 36, 465 70 S 525 118, 600 82"/>
  </defs>

  <!-- 网格 -->
  <g stroke="#2563eb" stroke-opacity=".10" stroke-width="1">
    <path d="M0 40 H600 M0 80 H600 M0 120 H600"/>
    <path d="M100 0 V160 M200 0 V160 M300 0 V160 M400 0 V160 M500 0 V160" stroke-dasharray="3 7"/>
  </g>

  <!-- 动态填充区 -->
  <path d="M0 96 C 40 96, 55 44, 90 44 S 145 128, 185 108 S 235 30, 275 62 S 330 130, 370 96 S 425 36, 465 70 S 525 118, 600 82 L600 160 L0 160 Z" fill="url(#area)">
    <animate attributeName="opacity" values=".65;1;.65" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- 主波形：虚线流动 -->
  <use href="#wavePath" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <use href="#wavePath" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"
       stroke-dasharray="14 220" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-468" dur="4.5s" repeatCount="indefinite"/>
  </use>

  <!-- 沿路径游走的光点 -->
  <circle r="5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M0 96 C 40 96, 55 44, 90 44 S 145 128, 185 108 S 235 30, 275 62 S 330 130, 370 96 S 425 36, 465 70 S 525 118, 600 82"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- 基线脉冲点 -->
  <g fill="#2563eb">
    <circle cx="90" cy="44" r="3"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="62" r="3"><animate attributeName="r" values="3;6;3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="465" cy="70" r="3"><animate attributeName="r" values="3;6;3" dur="2.6s" begin="2.0s" repeatCount="indefinite"/></circle>
  </g>
</svg>
