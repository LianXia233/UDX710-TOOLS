<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" preserveAspectRatio="none" role="img" aria-label="动态信号波形">
  <defs>
    <!-- 主波形渐变 -->
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="90%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 填充区渐变 -->
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <!-- 柔和发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 波形路径定义 -->
    <path id="primaryWave"
      d="M0 120 C 50 120, 80 50, 130 50 S 190 150, 250 120 S 310 40, 370 70 S 440 160, 500 110 S 570 30, 630 80 S 710 145, 800 100"/>

    <path id="secondaryWave"
      d="M0 135 C 60 135, 110 80, 160 80 S 230 160, 290 130 S 360 65, 420 90 S 490 155, 550 125 S 620 50, 680 95 S 750 130, 800 115"/>
  </defs>

  <!-- 科技背景标尺网格 -->
  <g stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke-dasharray="4 8"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke-dasharray="4 8"/>
    <line x1="500" y1="0" x2="500" y2="200" stroke-dasharray="4 8"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="200" stroke-dasharray="4 8"/>
  </g>

  <!-- 次级波形（半透明背景波） -->
  <use href="#secondaryWave" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="2"/>

  <!-- 主波形半透明渐变填充闭合区域 -->
  <path d="M0 120 C 50 120, 80 50, 130 50 S 190 150, 250 120 S 310 40, 370 70 S 440 160, 500 110 S 570 30, 630 80 S 710 145, 800 100 L800 200 L0 200 Z" fill="url(#waveFill)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.2s" repeatCount="indefinite"/>
  </path>

  <!-- 主波形路径 -->
  <use href="#primaryWave" fill="none" stroke="url(#waveLine)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- 沿着主波形穿梭的亮白流动光束 -->
  <use href="#primaryWave" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"
       stroke-dasharray="24 380" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-808" dur="3.8s" repeatCount="indefinite"/>
  </use>

  <!-- 主光子（沿路径滑动，带光晕） -->
  <circle r="6" fill="#ffffff" filter="url(#neonGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite"
      path="M0 120 C 50 120, 80 50, 130 50 S 190 150, 250 120 S 310 40, 370 70 S 440 160, 500 110 S 570 30, 630 80 S 710 145, 800 100"/>
    <animate attributeName="opacity" values="0;1;1;0.4;0" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 波峰呼吸脉冲采样点 -->
  <g fill="#0ea5e9">
    <circle cx="130" cy="50" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="70" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="80" r="3.5">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
