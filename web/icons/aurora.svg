<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="动态极光背景">
  <defs>
    <radialGradient id="a1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab6ff" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#b9d4ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fe3d2" stop-opacity=".42"/>
      <stop offset="60%" stop-color="#c9f4ec" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9b8ff" stop-opacity=".34"/>
      <stop offset="70%" stop-color="#e8e0ff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fa9ff" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#a8d8ff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#78e2d0" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#bcd8ff" stop-opacity=".20"/>
    </linearGradient>
  </defs>

  <g>
    <circle cx="300" cy="210" r="420" fill="url(#a1)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 110 70; -60 40; 0 0" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="r" values="420;470;400;420" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1320" cy="640" r="470" fill="url(#a2)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -120 -60; 60 -110; 0 0" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="180" r="330" fill="url(#a3)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 70 120; -90 30; 0 0" dur="31s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path fill="url(#wave1)"
    d="M0 690 C 260 610, 500 770, 800 680 S 1340 600, 1600 670 L1600 900 L0 900 Z">
    <animate attributeName="d" dur="17s" repeatCount="indefinite"
      values="M0 690 C 260 610, 500 770, 800 680 S 1340 600, 1600 670 L1600 900 L0 900 Z;
              M0 660 C 260 750, 520 600, 800 700 S 1320 750, 1600 640 L1600 900 L0 900 Z;
              M0 690 C 260 610, 500 770, 800 680 S 1340 600, 1600 670 L1600 900 L0 900 Z"/>
  </path>
  <path fill="url(#wave2)"
    d="M0 780 C 300 720, 560 830, 880 760 S 1360 720, 1600 780 L1600 900 L0 900 Z">
    <animate attributeName="d" dur="21s" repeatCount="indefinite"
      values="M0 780 C 300 720, 560 830, 880 760 S 1360 720, 1600 780 L1600 900 L0 900 Z;
              M0 750 C 320 830, 600 710, 900 790 S 1340 810, 1600 750 L1600 900 L0 900 Z;
              M0 780 C 300 720, 560 830, 880 760 S 1360 720, 1600 780 L1600 900 L0 900 Z"/>
  </path>

  <g fill="#ffffff" opacity=".5">
    <circle cx="180" cy="120" r="2.5">
      <animate attributeName="opacity" values=".15;.8;.15" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="300" r="2">
      <animate attributeName="opacity" values=".7;.15;.7" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1460" cy="180" r="2">
      <animate attributeName="opacity" values=".2;.85;.2" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="420" r="1.8">
      <animate attributeName="opacity" values=".6;.1;.6" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
