<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="5G-MIFI 动态全景标识">
  <defs>
    <!-- 背景渐变：现代科技深邃渐变 -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- 玻璃高光反光边框 -->
    <linearGradient id="brandBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 核心光晕 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 白色毛玻璃多层底座 -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#brandBg)"/>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="none" stroke="url(#brandBorder)" stroke-width="2"/>

  <!-- 上半球通透玻璃反光切面 -->
  <path d="M 6 32 C 6 18, 18 6, 32 6 L 88 6 C 102 6, 114 18, 114 32 C 114 50, 6 56, 6 32 Z" fill="#ffffff" fill-opacity="0.16"/>

  <!-- 顺时针旋转雷达刻度外环 -->
  <circle cx="60" cy="62" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 14">
    <animateTransform attributeName="transform" type="rotate" from="0 60 62" to="360 60 62" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- 逆时针旋转内环 -->
  <circle cx="60" cy="62" r="32" fill="none" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 16">
    <animateTransform attributeName="transform" type="rotate" from="360 60 62" to="0 60 62" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 核心能量光晕 (呼吸缩放) -->
  <circle cx="60" cy="66" r="26" fill="url(#centerGlow)">
    <animate attributeName="r" values="22;28;22" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 5G 信号放射弧（三层梯次点亮） -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#brandGlow)">
    <!-- 内弧 -->
    <path d="M 48 64 A 16 16 0 0 1 72 64" stroke-width="4">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 中弧 -->
    <path d="M 39 70 A 26 26 0 0 1 81 70" stroke-width="3.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 外弧 -->
    <path d="M 31 78 A 38 38 0 0 1 89 78" stroke-width="3.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 中心天线核心发射点 -->
  <circle cx="60" cy="66" r="4.5" fill="#ffffff" filter="url(#brandGlow)"/>

  <!-- 脉冲波纹从中心向外散开 -->
  <circle cx="60" cy="66" r="5" fill="none" stroke="#ffffff" stroke-width="1.8">
    <animate attributeName="r" values="5;22" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 顶部科技微标文字 5G·PRO -->
  <text x="60" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" letter-spacing="1.5" opacity="0.95">5G·MIFI</text>
</svg>
