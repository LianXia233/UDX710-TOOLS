<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="5G-MIFI 动态标识">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="2" y="2" width="116" height="116" rx="30" fill="none" stroke="#ffffff" stroke-opacity=".35"/>

  <!-- 旋转虚线外环 -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <circle cx="60" cy="60" r="46" stroke-dasharray="10 16">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="60" r="38" stroke-opacity=".25" stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="60" cy="60" r="34" fill="url(#halo)">
    <animate attributeName="r" values="30;38;30" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;.35;.8" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 信号弧：由内向外依次点亮 -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M44 68 A 20 20 0 0 1 76 68" stroke-width="5">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M36 74 A 30 30 0 0 1 84 74" stroke-width="5">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M30 80 A 39 39 0 0 1 90 80" stroke-width="4" stroke-opacity=".75">
      <animate attributeName="opacity" values=".25;.9;.25" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 中心脉冲点 -->
  <circle cx="60" cy="72" r="6" fill="#ffffff">
    <animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="72" r="10" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2">
    <animate attributeName="r" values="6;16;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
