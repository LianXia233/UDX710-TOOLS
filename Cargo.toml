# UDX710-TOOLS — Rust workspace
# 依据《UDX710-TOOLS Rust + 原生前端 Html5 详细技术报告》第 03/05/09 章：
# 分层架构 + Tokio + Axum + 体积优先的 release profile。
[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/platform-linux",
    "crates/storage",
    "crates/services",
    "crates/api",
    "crates/app",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"
repository = "https://github.com/LianXia233/UDX710-TOOLS"

[workspace.dependencies]
# ---- 内部 crate ----
udx-domain = { path = "crates/domain" }
udx-platform-linux = { path = "crates/platform-linux" }
udx-storage = { path = "crates/storage" }
udx-services = { path = "crates/services" }
udx-api = { path = "crates/api" }

# ---- 异步运行时与 HTTP ----
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "time", "process", "signal",
    "sync", "fs", "net", "io-util",
] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.5", features = [
    "limit", "timeout", "trace", "cors", "set-header",
] }
futures-util = "0.3"

# ---- 序列化与错误 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
toml = "0.8"

# ---- 日志 ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---- 基础设施 ----
rusqlite = { version = "0.31", features = ["bundled"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "json", "stream",
] }
url = "2"
libc = "0.2"
# gzip 归档解压（OTA .tar.gz 更新包），默认 features 即包含 deflate + gzip 读端
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ---- 认证与工具 ----
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock", "serde",
] }

# 报告 9.5：以体积为优先起点；"z"/"3" 需在真机对照测试后再选择。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
